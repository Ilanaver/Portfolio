<!doctype html>
<html lang="es" data-idioma="es" data-vista="error404">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>{{es:error404.titulo_pagina}}</title>
    <link rel="stylesheet" href="/src/index.css" />
  </head>
  <body class="fondo-grilla">
    <main class="pagina-error">
      <p class="pagina-error__codigo">404</p>
      <section>
        <h1>{{es:error404.titulo}}</h1>
        <p>{{es:error404.texto}}</p>
        <p><a href="/es/">{{es:error404.volver}}</a></p>
      </section>
      <section lang="en">
        <h2>{{en:error404.titulo}}</h2>
        <p>{{en:error404.texto}}</p>
        <p><a href="/en/">{{en:error404.volver}}</a></p>
      </section>
    </main>
  </body>
</html>
