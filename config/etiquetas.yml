# Catálogo de etiquetas (§2.6): nombre canónico → categoría + alias.
# Las etiquetas de `tecnologias` y `servicios` se normalizan con este archivo (sin distinguir mayúsculas
# ni espacios repetidos). Una etiqueta fuera del catálogo se publica tal cual, sin categoría ("Otros"),
# y genera una advertencia en el resumen de la corrida.
# Categorías: lenguaje, frontend, backend, datos, infra, automatizacion, mensajeria, ia.
# categoria: null = conocida pero sin categoría (aparece en "Otros").

