<!doctype html>
<html>
<head><meta charset="utf-8"><title>Bilingüe</title>
<style>
  body { margin: 0; font: 16px/1.4 sans-serif; }
  .es { background: #f4f1ea; color: #1b1b1b; }
  .en { background: #0b2545; color: #fff; }
  header { padding: 60px 40px; font-size: 56px; }
  .bloque { margin: 40px; height: 360px; }
  .es .bloque { background: #d9e3f0; }
  .en .bloque { background: #e09f3e; }
</style></head>
<body>
  <div id="raiz"><header></header><div class="bloque"></div></div>
  <script>
    var ingles = !navigator.language.toLowerCase().startsWith('es');
    document.getElementById('raiz').className = ingles ? 'en' : 'es';
    document.querySelector('header').textContent = ingles ? 'Made-up project' : 'Proyecto inventado';
  </script>
</body>
</html>
